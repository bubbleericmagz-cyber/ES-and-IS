{% comment %} Inline SVG icon sprite. Included once in base.html, then used anywhere with:

       <svg class="gv-icon"><use href="#i-package"></use></svg>

   Icons are stroke based and inherit the surrounding text colour, so they match
   whatever they sit beside. Kept inline so the system needs no icon font and
   works with no internet connection. {% endcomment %}

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
        <g id="gv-icon-defaults"></g>
    </defs>

    {# --- Navigation --- #}
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </symbol>

    <symbol id="i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8.5v7a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 15.5v-7a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8.5z"/>
        <path d="M3.3 7.4 12 12.5l8.7-5.1"/>
        <path d="M12 12.5V21"/>
    </symbol>

    <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3 9 5-9 5-9-5 9-5z"/>
        <path d="m3 13 9 5 9-5"/>
        <path d="m3 17.5 9 5 9-5"/>
    </symbol>

    <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="13" rx="2"/>
        <path d="M3 11h18"/>
        <path d="M9 7V4h6v3"/>
        <path d="M10.5 15.5h3"/>
    </symbol>

    <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="4" width="19" height="4.5" rx="1.5"/>
        <path d="M4.5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V8.5"/>
        <path d="M10 12.5h4"/>
    </symbol>

    <symbol id="i-inventory" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="8" height="8" rx="1.5"/>
        <rect x="13" y="3" width="8" height="8" rx="1.5"/>
        <rect x="3" y="13" width="8" height="8" rx="1.5"/>
        <path d="M13 17h8M17 13v8"/>
    </symbol>

    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/>
        <circle cx="9" cy="7" r="3.2"/>
        <path d="M22 20v-1.5a4 4 0 0 0-3-3.87"/>
        <path d="M16 4.13a4 4 0 0 1 0 7.75"/>
    </symbol>

    <symbol id="i-orders" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2.5h9l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4a1.5 1.5 0 0 1 1-1.5z"/>
        <path d="M14.5 2.5V7h4.5"/>
        <path d="M8.5 12.5h7M8.5 16h4.5"/>
    </symbol>

    <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 6.5h11v9h-11z"/>
        <path d="M13.5 10h4l3 3v2.5h-7z"/>
        <circle cx="6.5" cy="18" r="1.8"/>
        <circle cx="17" cy="18" r="1.8"/>
        <path d="M8.3 18h6.9"/>
    </symbol>

    <symbol id="i-report" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2.5h8.5L19 7v12.5A1.5 1.5 0 0 1 17.5 21h-11A1.5 1.5 0 0 1 5 19.5v-15A1.5 1.5 0 0 1 6 2.5z"/>

        <path d="M8.5 16.5v-3M12 16.5v-5.5M15.5 16.5v-2"/>
    </symbol>

    <symbol id="i-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2.5-7 5 14L17 12h4"/>
    </symbol>

    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.6 7.5 10 4.3-1.4 7.5-5.4 7.5-10v-6z"/>
        <path d="m9 12 2 2 4-4"/>
    </symbol>

    {# --- Interface --- #}
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/>
        <path d="M13.7 19.5a2 2 0 0 1-3.4 0"/>
    </symbol>

    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6"/>
    </symbol>

    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
    </symbol>

    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"

        <circle cx="10.5" cy="10.5" r="6.5"/>
        <path d="m20 20-4.8-4.8"/>
    </symbol>

    {# --- Status --- #}
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.7 3.7 2.5 18a1.5 1.5 0 0 0 1.3 2.2h16.4A1.5 1.5 0 0 0 21.5 18L13.3 3.7a1.5 1.5 0 0 0-2.6 0z"/>
        <path d="M12 9v4.5M12 17.2h.01"/>
    </symbol>

    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="m8.5 12 2.5 2.5 4.5-5"/>
    </symbol>

    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5.3l3.2 1.9"/>
    </symbol>

    <symbol id="i-trend" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 16.5 5.5-5.5 3.5 3.5L21 5.5"/>
        <path d="M15.5 5.5H21V11"/>
    </symbol>

    {# --- Botanical accents --- #}
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20c0-8 5-14 16-15 0 10-5 15-12 15a8 8 0 0 1-4 0z"/>
        <path d="M4.5 19.5C8 16 11.5 13 16 10.5"/>
    </symbol>

    <symbol id="i-droplet" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.7s6 6.2 6 10.3a6 6 0 0 1-12 0c0-4.1 6-10.3 6-10.3z"/>
    </symbol>
</svg>
