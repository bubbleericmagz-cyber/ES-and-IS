{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-body">
        {% if not batch %}
            <p class="text-muted small">
                The batch number is generated automatically, for example
                <code>GVC-BATCH-0001</code>. All units start as "not yet packaged".
            </p>
        {% endif %}
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "partials/form_fields.html" %}
            <div class="mt-4">
                <button type="submit" class="btn btn-guava">Save Batch</button>
                <a href="{% url 'batch_list' %}" class="btn btn-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
